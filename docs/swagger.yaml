basePath: /api/v1
definitions:
  domain.Group:
    properties:
      id:
        type: integer
      name:
        type: string
      organisation_id:
        type: integer
    type: object
  domain.GroupMember:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  domain.Organisation:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Task:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_id:
        description: |-
          GroupID is the user's group, which always belongs to OrganisationID (the
          database enforces it with a composite foreign key). A user without an
          organisation has both as 0 (NULL in the database, omitted from JSON).
        type: integer
      id:
        type: integer
      name:
        type: string
      organisation_id:
        type: integer
      signup_method:
        description: SignupMethod is how the user was created (SignupMethod* constants).
        example: email
        type: string
      updated_at:
        type: string
    type: object
  handler.assignGroupRequest:
    properties:
      group_id:
        example: 2
        type: integer
    type: object
  handler.assignGroupResponse:
    properties:
      group_id:
        example: 2
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  handler.createOrganisationRequest:
    properties:
      admin_email:
        example: alice@company.com
        type: string
      admin_name:
        example: Alice
        type: string
      name:
        example: Acme Corp
        type: string
    type: object
  handler.createRecordRequest:
    properties:
      description:
        type: string
      title:
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  handler.createUserRequest:
    properties:
      email:
        example: alice@company.com
        type: string
      name:
        example: Alice
        type: string
      organisation_id:
        example: 1
        type: integer
    type: object
  handler.deleteOrganisationRequest:
    properties:
      confirm_name:
        example: Acme Corp
        type: string
    type: object
  handler.groupRequest:
    properties:
      name:
        example: editors
        type: string
      organisation_id:
        example: 1
        type: integer
    type: object
  handler.loginRequest:
    properties:
      email:
        example: alice@company.com
        type: string
    type: object
  handler.organisationRequest:
    properties:
      name:
        example: Acme Corp
        type: string
    type: object
  handler.organisationResponse:
    properties:
      admin:
        $ref: '#/definitions/domain.User'
      id:
        example: 1
        type: integer
      name:
        example: Acme Corp
        type: string
    type: object
  handler.recordRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  handler.updateUserRequest:
    properties:
      email:
        example: alice@company.com
        type: string
      name:
        example: Alice
        type: string
    type: object
  util.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: CRUD API for records stored in PostgreSQL.
  title: Records CRUD API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'There is no password: knowing the email of a user created with
        POST /auth/users is enough (development only, no proof of ownership). On success,
        sets an HttpOnly "session" cookie (SameSite=Strict) that the browser sends
        on later requests, and returns the user. Accounts can only sign in with the
        method they were created with (403 for google/github accounts). An unknown
        email returns 401. After 5 failed attempts per email and IP, 429 for 15 minutes.'
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Sign in with an email
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends the current session and clears the cookie. Requires a session.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Sign out
      tags:
      - auth
  /auth/organisations:
    post:
      consumes:
      - application/json
      description: 'Needs no session. Creates the organisation (name unique, ignoring
        case) with an "admin" and a "member" group, and its first admin user from
        admin_name and admin_email, in one step: the email must not be registered
        yet (409), and nothing is created if any part fails. Personal email providers
        (gmail, yahoo, ...) are rejected. The admin signs in with POST /auth/login.'
      parameters:
      - description: Organisation and its admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createOrganisationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.organisationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create an organisation
      tags:
      - auth
  /auth/users:
    post:
      consumes:
      - application/json
      description: 'Needs no session. organisation_id is required: the user gets the
        basic "member" role in that organisation (404 if it doesn''t exist). Returns
        the created user. There is no password; the user signs in with POST /auth/login
        using the email. Personal email providers (gmail, yahoo, ...) are rejected.'
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a user
      tags:
      - auth
  /groups:
    get:
      description: Returns only the groups in the given organisation (an empty list
        if it has none).
      parameters:
      - description: Organisation ID
        in: query
        name: organisation_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Group'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the groups of an organisation
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Returns the new group, including its ID. Names are lower-cased,
        must start with a letter, and are unique within the organisation.
      parameters:
      - description: Group to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.groupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a group in an organisation
      tags:
      - groups
  /groups/{id}:
    delete:
      description: Fails with 409 while the group still has users; move them with
        the assign-group endpoint first.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete a group
      tags:
      - groups
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get a group by ID
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Sets the group's organisation and name (both required). The name
        must be unique within the organisation. A group that has users cannot be moved
        to another organisation (409).
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: New group details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.groupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Update a group
      tags:
      - groups
  /groups/{id}/users:
    get:
      description: Returns the name and email of every user in the group (an empty
        list if the group has no users).
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.GroupMember'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the users in a group
      tags:
      - groups
  /organisation:
    delete:
      consumes:
      - application/json
      description: Admins only (403 for members). PERMANENTLY deletes the organisation,
        its groups, all its users (the caller included) and all their records, in
        one transaction. confirm_name must be the organisation's exact name (400 otherwise).
        The users' sessions stop working immediately. Requires a session.
      parameters:
      - description: Confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.deleteOrganisationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete my organisation
      tags:
      - organisations
    get:
      description: The organisation of the signed-in user; no id is needed. 404 for
        a user without an organisation. Requires a session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Organisation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get my organisation
      tags:
      - organisations
    put:
      consumes:
      - application/json
      description: Admins only (403 for members). The new name must be unique, ignoring
        case. Requires a session.
      parameters:
      - description: New organisation details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.organisationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Organisation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Rename my organisation
      tags:
      - organisations
  /organisations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Organisation'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List all organisations
      tags:
      - organisations
  /records:
    get:
      description: Returns only the records that belong to the given user (an empty
        list if they have none).
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Task'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the records of a user
      tags:
      - records
    post:
      consumes:
      - application/json
      description: The record belongs to the user given by user_id (404 if the user
        doesn't exist).
      parameters:
      - description: Record to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createRecordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a record for a user
      tags:
      - records
  /records/{id}:
    delete:
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete a record
      tags:
      - records
    get:
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get a record by ID
      tags:
      - records
    put:
      consumes:
      - application/json
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      - description: New title and description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.recordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Update a record
      tags:
      - records
  /users/{id}:
    delete:
      description: Fails with 409 while the user still has records; delete those first.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete a user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get a user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Changes the name and email (work email only). The group is changed
        with the assign-group endpoint.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New user details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Update a user
      tags:
      - users
  /users/{id}/group:
    put:
      consumes:
      - application/json
      description: The group must exist (404) and belong to the organisation stored
        on the user (400 otherwise).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Group to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.assignGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.assignGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Assign a group to a user
      tags:
      - users
swagger: "2.0"
