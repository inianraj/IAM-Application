basePath: /api/v1
definitions:
  domain.Group:
    properties:
      id:
        type: integer
      name:
        type: string
      organisation_id:
        type: integer
    type: object
  domain.GroupMember:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Organisation:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Permission:
    properties:
      action:
        example: read
        type: string
      description:
        example: Read your own records
        type: string
      key:
        example: record:read:own
        type: string
      resource:
        example: record
        type: string
      scope:
        example: own
        type: string
    type: object
  domain.Role:
    properties:
      id:
        type: integer
      name:
        type: string
      organisation_id:
        type: integer
    type: object
  domain.Task:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      organisation_id:
        description: |-
          OrganisationID is the owner's organisation, stored with the record so
          organisation-wide permissions can be checked without loading the owner.
          It is 0 (omitted) for records of legacy users without an organisation.
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_id:
        description: |-
          GroupID is the user's group, which always belongs to OrganisationID (the
          database enforces it with a composite foreign key). A user without an
          organisation has both as 0 (NULL in the database, omitted from JSON).
        type: integer
      id:
        type: integer
      name:
        type: string
      organisation_id:
        type: integer
      signup_method:
        description: SignupMethod is how the user was created (SignupMethod* constants).
        example: email
        type: string
      updated_at:
        type: string
    type: object
  handler.assignGroupRequest:
    properties:
      group_id:
        example: 2
        type: integer
    type: object
  handler.assignGroupResponse:
    properties:
      group_id:
        example: 2
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  handler.createGroupRequest:
    properties:
      name:
        example: editors
        type: string
      organisation_id:
        example: 1
        type: integer
      role_ids:
        description: |-
          RoleIDs are IDs from GET /roles. Leave the field out for a group with no
          roles.
        example:
        - 4
        items:
          type: integer
        type: array
    type: object
  handler.createOrganisationRequest:
    properties:
      admin_email:
        example: alice@company.com
        type: string
      admin_name:
        example: Alice
        type: string
      admin_password:
        description: AdminPassword is the owner's password (8 to 72 bytes).
        example: s3cret-pass
        type: string
      name:
        example: Acme Corp
        type: string
    type: object
  handler.createRecordRequest:
    properties:
      description:
        type: string
      title:
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  handler.createRoleRequest:
    properties:
      name:
        example: developer
        type: string
      permissions:
        description: |-
          Permissions are keys from GET /permissions. Leave the field out for a
          role with none.
        example:
        - record:read:org
        items:
          type: string
        type: array
    type: object
  handler.createUserRequest:
    properties:
      email:
        example: alice@company.com
        type: string
      name:
        example: Alice
        type: string
      password:
        example: s3cret-pass
        type: string
      role_ids:
        description: |-
          RoleIDs are IDs from GET /roles. Leave the field out to give the user the
          member role.
        example:
        - 4
        items:
          type: integer
        type: array
    type: object
  handler.deleteOrganisationRequest:
    properties:
      confirm_name:
        example: Acme Corp
        type: string
    type: object
  handler.groupRequest:
    properties:
      name:
        example: editors
        type: string
      organisation_id:
        example: 1
        type: integer
    type: object
  handler.loginRequest:
    properties:
      email:
        example: alice@company.com
        type: string
      password:
        example: s3cret-pass
        type: string
    type: object
  handler.organisationRequest:
    properties:
      name:
        example: Acme Corp
        type: string
    type: object
  handler.organisationResponse:
    properties:
      admin:
        $ref: '#/definitions/domain.User'
      id:
        example: 1
        type: integer
      name:
        example: Acme Corp
        type: string
    type: object
  handler.recordRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  handler.rolePermissionsRequest:
    properties:
      permissions:
        example:
        - record:read:org
        - user:read
        items:
          type: string
        type: array
    type: object
  handler.rolePermissionsResponse:
    properties:
      permissions:
        example:
        - record:read:org
        - user:read
        items:
          type: string
        type: array
    type: object
  handler.setRolesRequest:
    properties:
      role_ids:
        example:
        - 4
        - 5
        items:
          type: integer
        type: array
    type: object
  handler.updateRoleRequest:
    properties:
      name:
        example: developer
        type: string
    type: object
  handler.updateUserRequest:
    properties:
      name:
        example: Alice
        type: string
    type: object
  handler.userPermissionsResponse:
    properties:
      permissions:
        example:
        - record:read:own
        - user:read
        items:
          type: string
        type: array
    type: object
  util.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: CRUD API for records stored in PostgreSQL.
  title: Records CRUD API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Checks the email and password; a wrong password and an unknown
        email both return 401 "invalid email or password". On success, sets an HttpOnly
        "session" cookie (SameSite=Strict) that the browser sends on later requests,
        and returns the user. Accounts can only sign in with the method they were
        created with (403 for google/github accounts). After 5 failed attempts per
        email and IP, 429 for 15 minutes.
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Sign in with an email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends the current session and clears the cookie. Requires a session.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Sign out
      tags:
      - auth
  /auth/organisations:
    post:
      consumes:
      - application/json
      description: 'Needs no session. Creates the organisation (name unique, ignoring
        case) with its four built-in roles (owner, admin, member, guest) and its first
        user from admin_name, admin_email and admin_password (8 to 72 bytes), who
        gets the owner role, in one step: the email must not be registered yet (409),
        and nothing is created if any part fails. Personal email providers (gmail,
        yahoo, ...) are rejected. The owner signs in with POST /auth/login using the
        email and password.'
      parameters:
      - description: Organisation and its admin
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createOrganisationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.organisationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create an organisation
      tags:
      - auth
  /auth/users:
    post:
      consumes:
      - application/json
      description: Requires a session and the user:assign_group permission (admins).
        The user is added to your own organisation with the member role (or the role_ids
        you give, which needs role:assign and permissions you hold yourself) and no
        group; there is no way to join an organisation without an admin. Returns the
        created user. A password is required (8 to 72 bytes); the user signs in with
        POST /auth/login using the email and password. Personal email providers (gmail,
        yahoo, ...) are rejected.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a user
      tags:
      - auth
  /groups:
    get:
      description: Returns only the groups in the given organisation (an empty list
        if it has none).
      parameters:
      - description: Organisation ID
        in: query
        name: organisation_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Group'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the groups of an organisation
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Needs group:create. Returns the new group, including its ID. Names
        are lower-cased, must start with a letter, and are unique within the organisation.
        role_ids (IDs from GET /roles) give the group its roles and need role:assign;
        without them the group has none, and its members only get what their own roles
        allow.
      parameters:
      - description: Group to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a group in an organisation
      tags:
      - groups
  /groups/{id}:
    delete:
      description: Fails with 409 while the group still has users; move them with
        the assign-group endpoint first.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete a group
      tags:
      - groups
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get a group by ID
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Sets the group's organisation and name (both required). The name
        must be unique within the organisation. A group that has users cannot be moved
        to another organisation (409).
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: New group details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.groupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Update a group
      tags:
      - groups
  /groups/{id}/roles:
    get:
      description: Needs group:read. Every member of the group gets what these roles
        allow, on top of their own roles.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Role'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the roles of a group
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Needs role:assign. Replaces the group's roles with the given role
        IDs (404 for a role that does not exist in the organisation). You can only
        add or remove roles whose permissions you hold yourself (403 otherwise). Takes
        effect for the members on their next request.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: New roles
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Role'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Change the roles of a group
      tags:
      - groups
  /groups/{id}/users:
    get:
      description: Returns the name and email of every user in the group (an empty
        list if the group has no users).
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.GroupMember'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List the users in a group
      tags:
      - groups
  /organisation:
    delete:
      consumes:
      - application/json
      description: Admins only (403 for members). PERMANENTLY deletes the organisation,
        its groups, all its users (the caller included) and all their records, in
        one transaction. confirm_name must be the organisation's exact name (400 otherwise).
        The users' sessions stop working immediately. Requires a session.
      parameters:
      - description: Confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.deleteOrganisationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete my organisation
      tags:
      - organisations
    get:
      description: The organisation of the signed-in user; no id is needed. 404 for
        a user without an organisation. Requires a session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Organisation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get my organisation
      tags:
      - organisations
    put:
      consumes:
      - application/json
      description: Admins only (403 for members). The new name must be unique, ignoring
        case. Requires a session.
      parameters:
      - description: New organisation details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.organisationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Organisation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Rename my organisation
      tags:
      - organisations
  /organisations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Organisation'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List all organisations
      tags:
      - organisations
  /permissions:
    get:
      description: Needs role:read. Returns the permissions a role can be given, with
        a description and the resource they belong to.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Permission'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List every permission
      tags:
      - roles
  /records:
    get:
      description: 'With user_id: that user''s records (record:read:own for yourself,
        record:read:org for others). With scope=org: every record of your organisation
        (needs record:read:org). With neither: your own records. An empty list if
        there are none.'
      parameters:
      - description: User ID
        in: query
        name: user_id
        type: integer
      - description: Use org for every record of your organisation
        enum:
        - org
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Task'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: List records
      tags:
      - records
    post:
      consumes:
      - application/json
      description: The record belongs to the user given by user_id (404 if the user
        doesn't exist).
      parameters:
      - description: Record to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createRecordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a record for a user
      tags:
      - records
  /records/{id}:
    delete:
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Delete a record
